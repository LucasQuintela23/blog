{% extends "base.html" %}

{% block title %}{{ post.title }} | Tech Blog{% endblock %}

{% block content %}
<article class="blog-post">
    <header class="mb-5">
        <div class="post-meta mb-2">
            <time datetime="{{ post.created_at|date:'c' }}">
                {{ post.created_at|date:"F d, Y" }}
            </time>
        </div>
        <h1 class="display-4 fw-bold mb-4">{{ post.title }}</h1>
        <p class="lead text-secondary">{{ post.summary }}</p>
    </header>

    <div class="article-content">
        {{ post.body_html|safe }}
    </div>

    <hr class="my-5">

    <div class="d-flex justify-content-between align-items-center">
        <a href="{% url 'blog:post_list' %}" class="btn btn-outline-secondary">
            &larr; Back to Home
        </a>
    </div>
</article>
{% endblock %}
